name: Deploy Sistematizacao

on:
  push:
    branches: [main]
  workflow_dispatch:

# uma implantacao por vez: evita dois `docker compose up` disputando o mesmo diretorio
concurrency:
  group: deploy-sistematizacao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync e build
        run: |
          rsync -av --exclude='.env' --exclude='.git' \
            "$GITHUB_WORKSPACE/" /DATA/sistematizacao/
          cd /DATA/sistematizacao
          docker compose up -d --build

      - name: Aguardar o container ficar saudavel
        run: |
          cd /DATA/sistematizacao
          # a porta do host vem do .env do servidor; 8000 e so a porta interna
          if [ -f .env ]; then set -a; . ./.env; set +a; fi
          PORTA="${APP_PORT:-8005}"
          echo "Checando http://127.0.0.1:${PORTA}/health"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORTA}/health"; then
              echo ""
              echo "API respondeu apos ~$((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "A API nao respondeu no /health a tempo. Logs:"
          docker compose logs --tail=80
          exit 1

      - name: Instalar timer systemd no host
        run: |
          chmod +x /DATA/sistematizacao/scripts/retreinar.sh
          chmod +x /DATA/sistematizacao/scripts/instalar-timer.sh
          # O runner nao tem TTY: sudo pede senha e falha. So tenta se NOPASSWD existir.
          if sudo -n true 2>/dev/null; then
            sudo /DATA/sistematizacao/scripts/instalar-timer.sh
          else
            echo "::warning title=Timer systemd::Deploy OK, mas o timer nao foi instalado/atualizado."
            echo "Rode uma vez no host: sudo /DATA/sistematizacao/scripts/instalar-timer.sh"
            echo "Ou configure NOPASSWD para instalar-timer.sh (veja scripts/instalar-runner.sh)."
          fi

      - name: Limpar imagens orfas
        if: success()
        run: docker image prune -f
