name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  qualidade:
    name: Lint e smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml

      - name: Instalar dependencias
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check src

      - name: Ruff (formatacao)
        run: uv run ruff format --check src

      - name: Smoke test - importar todos os modulos
        run: |
          uv run python -c "
          import importlib
          for m in ['carregamento_inicial', 'eda', 'treinamento_avaliacao',
                    'observacao', 'carregar_modelo', 'web']:
              importlib.import_module(f'sistematizacao.{m}')
              print('ok:', m)
          "

      - name: Smoke test - API responde /health
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from sistematizacao.web import app
          r = TestClient(app).get('/health')
          assert r.status_code == 200, r.text
          print(r.json())
          "

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: qualidade
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Nao publica em registry: quem constroi a imagem que roda e o proprio
      # servidor de casa, no workflow deploy.yml. Este job so garante que o
      # Dockerfile continua buildando antes do deploy tocar o servidor.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./python
          file: ./python/Dockerfile
          push: false
          tags: sistematizacao-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
