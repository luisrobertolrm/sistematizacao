name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qualidade:
    name: Lint e smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml

      - name: Instalar dependencias
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check src

      - name: Ruff (formatacao)
        run: uv run ruff format --check src

      - name: Smoke test - importar todos os modulos
        run: |
          uv run python -c "
          import importlib
          for m in ['carregamento_inicial', 'eda', 'treinamento_avaliacao',
                    'observacao', 'carregar_modelo', 'web']:
              importlib.import_module(f'sistematizacao.{m}')
              print('ok:', m)
          "

      - name: Smoke test - API responde /health
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from sistematizacao.web import app
          r = TestClient(app).get('/health')
          assert r.status_code == 200, r.text
          print(r.json())
          "

  docker:
    name: Build e publicar imagem
    runs-on: ubuntu-latest
    needs: qualidade
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (e push fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: ./python
          file: ./python/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
