[project]
name = "sistematizacao"
version = "0.1.0"
description = "Sistematizacao da escolha de modelo - previsao de churn (Telco Customer Churn)"
readme = "README.md"
authors = [
    { name = "Luis Roberto", email = "luisrobertolrm@gmail.com" }
]
requires-python = ">=3.12"
# versoes fixas: o resultado do modelo depende da versao do scikit-learn/numpy,
# e o binario em modelos/ so recarrega sem warning na mesma versao em que foi gravado.
dependencies = [
    "faker==40.36.0",
    "fastapi==0.141.1",
    "joblib==1.5.3",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "optuna==4.9.0",
    "pandas==3.0.5",
    "pydantic==2.13.4",
    "scikit-learn==1.9.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
# usado so para baixar o dataset do Kaggle na primeira execucao
dados = ["kagglehub==1.0.2"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[project.scripts]
sistematizacao = "sistematizacao:main"
sistematizacao-web = "sistematizacao.web:main"
sistematizacao-eda = "sistematizacao.eda:main"
sistematizacao-treino = "sistematizacao.treinamento_avaliacao:main"
sistematizacao-observacao = "sistematizacao.observacao:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "T201",   # Checks for print statements,
  "COM812", # Checks for the absence of trailing commas.
  "INP001", # Checks for packages that are missing an __init__.py file.
  "D",      # All pydocstyle (D)
  "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
  "ERA001", # Checks for commented-out Python code.
  "A004",   # Shadowing Python Builtin
  "N803",   # Argument name should be lowercase (X e convencao do scikit-learn)
  "N806",   # Variable in function should be lowercase (idem)
  "CPY001", # Missing copyright notice at top of file
  "PLR0913",# Too many arguments
  "RUF001", # Ambiguous unicode character (textos em portugues sem acento)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["sistematizacao"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = [
  "**/venv",
  "**/.venv",
  "**/env",
  "**/.env",
  "**/node_modules",
  "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
